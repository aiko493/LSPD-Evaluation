<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Évaluateur LSPD — Entretien de recrutement</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg: #10141b;
  --panel: #1a2029;
  --panel-alt: #151a22;
  --border: #2c3441;
  --gold: #c7a44d;
  --gold-dim: #8a733a;
  --text: #e9e5d8;
  --text-dim: #8f96a3;
  --green: #4f8f63;
  --green-dim: #2b3f30;
  --red: #a8453f;
  --red-dim: #3f2b2a;
  --amber: #c8a854;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, #171d27 0%, transparent 45%),
    radial-gradient(circle at 85% 100%, #161b23 0%, transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  padding:40px 20px 80px;
}

.wrap{max-width:880px;margin:0 auto;}

/* Header / badge block */
.masthead{
  display:flex;
  align-items:center;
  gap:20px;
  border-bottom:1px solid var(--border);
  padding-bottom:22px;
  margin-bottom:30px;
}
.badge{
  width:56px;height:56px;flex:0 0 auto;
  border:2px solid var(--gold);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.badge::before{
  content:"";
  position:absolute; inset:6px;
  border:1px solid var(--gold-dim);
  border-radius:50%;
}
.badge span{
  font-family:'Oswald',sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--gold);
  letter-spacing:1px;
}
.masthead h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:26px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin:0;
  color:var(--text);
}
.masthead .sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:0.5px;
  margin-top:4px;
}

/* Candidate info */
.candidate-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:14px;
  margin-bottom:34px;
}
.field label{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold-dim);
  margin-bottom:6px;
}
.field input{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:4px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  padding:10px 12px;
}
.field input:focus{outline:none;border-color:var(--gold-dim);}

/* Section cards */
.section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  margin-bottom:18px;
  overflow:hidden;
}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  padding:18px 22px 0;
}
.section-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  letter-spacing:1px;
}
.section-title{
  font-family:'Oswald',sans-serif;
  font-size:17px;
  font-weight:600;
  letter-spacing:0.3px;
  color:var(--text);
  flex:1;
  margin-left:12px;
}
.section-score-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--text-dim);
  white-space:nowrap;
}
.section-score-badge b{color:var(--gold);font-size:15px;}

.section-body{padding:16px 22px 22px;}

.prompts{
  list-style:none;
  margin:0 0 16px;
  padding:0;
  border-left:2px solid var(--border);
}
.prompts li{
  font-size:13.5px;
  color:var(--text-dim);
  padding:6px 0 6px 14px;
  line-height:1.5;
}
.prompts li .hint{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--gold-dim);
  margin-top:3px;
  line-height:1.4;
}

.slider-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.slider-row input[type=range]{
  flex:1;
  -webkit-appearance:none;
  height:4px;
  border-radius:2px;
  background:var(--border);
  outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;height:16px;
  border-radius:50%;
  background:var(--gold);
  cursor:pointer;
  border:2px solid #0f1319;
}
.slider-row input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--gold);cursor:pointer;border:2px solid #0f1319;
}
.slider-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  width:52px;
  text-align:right;
  color:var(--text);
}

textarea{
  width:100%;
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:4px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:13.5px;
  padding:10px 12px;
  min-height:56px;
  resize:vertical;
}
textarea::placeholder{color:#5c6270;}
textarea:focus{outline:none;border-color:var(--gold-dim);}

/* Verdict */
.verdict{
  position:relative;
  margin-top:36px;
  padding:28px 26px;
  border:1px solid var(--border);
  border-radius:6px;
  background:var(--panel);
  display:flex;
  align-items:center;
  gap:26px;
  flex-wrap:wrap;
}
.verdict-score{
  font-family:'Oswald',sans-serif;
  font-size:44px;
  font-weight:700;
  color:var(--gold);
  line-height:1;
  min-width:110px;
}
.verdict-score span{
  display:block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-dim);
  font-weight:400;
  letter-spacing:1px;
  margin-top:6px;
}
.verdict-text{flex:1;min-width:200px;}
.verdict-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:1.5px;
  color:var(--text-dim);
  text-transform:uppercase;
  margin-bottom:6px;
}
.verdict-recommendation{
  font-family:'Oswald',sans-serif;
  font-size:20px;
  font-weight:600;
  letter-spacing:0.5px;
}
.verdict-recommendation.pass{color:var(--green);}
.verdict-recommendation.wait{color:var(--amber);}
.verdict-recommendation.fail{color:var(--red);}

.stamp{
  position:absolute;
  top:-14px;
  right:24px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:2px;
  padding:8px 16px;
  border:3px solid;
  border-radius:4px;
  transform:rotate(-8deg);
  text-transform:uppercase;
  background:rgba(16,20,27,0.9);
  opacity:0;
  transition:opacity 0.4s ease, transform 0.4s ease;
  pointer-events:none;
}
.stamp.show{opacity:0.92;}
.stamp.pass{color:var(--green);border-color:var(--green);}
.stamp.wait{color:var(--amber);border-color:var(--amber);}
.stamp.fail{color:var(--red);border-color:var(--red);}

.actions{
  display:flex;
  gap:12px;
  margin-top:22px;
  flex-wrap:wrap;
}
button.action{
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.5px;
  color:var(--text);
  background:var(--panel-alt);
  border:1px solid var(--border);
  border-radius:4px;
  padding:11px 18px;
  cursor:pointer;
  transition:border-color 0.15s ease, color 0.15s ease;
}
button.action:hover{border-color:var(--gold-dim);color:var(--gold);}
button.action.primary{border-color:var(--gold-dim);color:var(--gold);}
button.action.primary:hover{background:var(--gold);color:#12151b;}

.copy-msg{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--green);
  align-self:center;
  opacity:0;
  transition:opacity 0.3s ease;
}
.copy-msg.show{opacity:1;}

footer.foot{
  text-align:center;
  margin-top:40px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#4a5060;
  letter-spacing:0.5px;
}

@media(max-width:640px){
  .candidate-row{grid-template-columns:1fr;}
  .verdict{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="badge"><span>LSPD</span></div>
    <div>
      <h1>Évaluateur d'entretien</h1>
      <div class="sub">Los Santos Police Department — Fiche de recrutement</div>
    </div>
  </div>

  <div class="candidate-row">
    <div class="field">
      <label>Nom du candidat</label>
      <input type="text" id="candName" placeholder="Pseudo / nom RP">
    </div>
    <div class="field">
      <label>Évaluateur</label>
      <input type="text" id="evalName" placeholder="Votre nom">
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="evalDate">
    </div>
  </div>

  <div id="sections"></div>

  <div class="verdict">
    <div class="stamp" id="stamp">—</div>
    <div class="verdict-score"><span id="scoreTotal">0</span><span>/ 100 points</span></div>
    <div class="verdict-text">
      <div class="verdict-label">Recommandation</div>
      <div class="verdict-recommendation" id="recoText">Complétez l'évaluation</div>
    </div>
  </div>

  <div class="actions">
    <button class="action primary" id="copyBtn">Copier le rapport</button>
    <button class="action" id="printBtn">Imprimer / PDF</button>
    <button class="action" id="resetBtn">Réinitialiser</button>
    <span class="copy-msg" id="copyMsg">Rapport copié ✓</span>
  </div>

  <footer class="foot">OUTIL D'ÉVALUATION INTERNE — USAGE ROLEPLAY UNIQUEMENT</footer>
</div>

<script>
const SECTIONS = [
  {
    id: "motivation",
    title: "Motivation & connaissance du rôle",
    prompts: [
      "Pourquoi souhaitez-vous rejoindre le LSPD ?",
      "Que savez-vous du fonctionnement du département ?",
      "Avez-vous déjà occupé un rôle similaire sur un autre serveur ?"
    ]
  },
  {
    id: "regles",
    title: "Connaissance des règles & du RP",
    prompts: [
      "Différence entre metagaming et powergaming.",
      { text: "Citez 3 règles importantes que doit respecter un policier.", hint: "Respecter la loi, protéger les citoyens, être impartial" },
      "Connaît-il la procédure d'interpellation standard ?"
    ]
  },
  {
    id: "situation",
    title: "Mise en situation",
    prompts: [
      "Un suspect refuse d'obtempérer et prend la fuite en véhicule.",
      "Il est témoin d'une bavure d'un collègue.",
      "Un civil l'insulte pendant un contrôle routier."
    ]
  },
  {
    id: "qualites",
    title: "Qualités personnelles",
    prompts: [
      "Disponibilité annoncée (heures / semaine).",
      "Clarté et calme dans la communication.",
      "Maturité et gestion du stress à l'oral."
    ]
  },
  {
    id: "technique",
    title: "Connaissances techniques",
    prompts: [
      "Codes radio de base (10-4, Code 3...).",
      "Procédure d'appel de renfort.",
      "Utilisation du MDT et du matériel standard."
    ]
  }
];

const state = {};
SECTIONS.forEach(s => state[s.id] = { score: 10, note: "" });

const sectionsEl = document.getElementById('sections');

SECTIONS.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'section';
  card.innerHTML = `
    <div class="section-head">
      <div class="section-num">${String(i+1).padStart(2,'0')}</div>
      <div class="section-title">${s.title}</div>
      <div class="section-score-badge"><b id="badge-${s.id}">10</b>/20</div>
    </div>
    <div class="section-body">
      <ul class="prompts">
        ${s.prompts.map(p => {
          if (typeof p === 'string') return `<li>${p}</li>`;
          return `<li>${p.text}<span class="hint">💡 Réponse attendue : ${p.hint}</span></li>`;
        }).join('')}
      </ul>
      <div class="slider-row">
        <input type="range" min="0" max="20" value="10" id="slider-${s.id}">
        <div class="slider-val" id="val-${s.id}">10 / 20</div>
      </div>
      <textarea id="note-${s.id}" placeholder="Notes sur les réponses du candidat..."></textarea>
    </div>
  `;
  sectionsEl.appendChild(card);
});

function computeTotal(){
  let total = 0;
  SECTIONS.forEach(s => total += state[s.id].score);
  return total;
}

function updateVerdict(){
  const total = computeTotal();
  document.getElementById('scoreTotal').textContent = total;
  const recoEl = document.getElementById('recoText');
  const stampEl = document.getElementById('stamp');

  recoEl.classList.remove('pass','wait','fail');
  stampEl.classList.remove('pass','wait','fail','show');

  let label, cls;
  if (total >= 60) { label = 'Admis en formation'; cls = 'pass'; }
  else { label = 'Refusé'; cls = 'fail'; }

  recoEl.textContent = label;
  recoEl.classList.add(cls);

  stampEl.textContent = cls === 'pass' ? 'Approuvé' : (cls === 'wait' ? 'En attente' : 'Refusé');
  stampEl.classList.add(cls);
  setTimeout(() => stampEl.classList.add('show'), 10);
}

SECTIONS.forEach(s => {
  const slider = document.getElementById(`slider-${s.id}`);
  const val = document.getElementById(`val-${s.id}`);
  const badge = document.getElementById(`badge-${s.id}`);
  const note = document.getElementById(`note-${s.id}`);

  slider.addEventListener('input', () => {
    state[s.id].score = parseInt(slider.value, 10);
    val.textContent = `${slider.value} / 20`;
    badge.textContent = slider.value;
    updateVerdict();
  });
  note.addEventListener('input', () => {
    state[s.id].note = note.value;
  });
});

document.getElementById('evalDate').valueAsDate = new Date();
updateVerdict();

function buildReport(){
  const total = computeTotal();
  let reco;
  if (total >= 60) reco = 'ADMIS EN FORMATION';
  else reco = 'REFUSÉ';

  const name = document.getElementById('candName').value || '(non renseigné)';
  const evaluator = document.getElementById('evalName').value || '(non renseigné)';
  const date = document.getElementById('evalDate').value || '(non renseignée)';

  let report = `=== FICHE D'ÉVALUATION — LSPD ===\\n`;
  report += `Candidat : ${name}\\n`;
  report += `Évaluateur : ${evaluator}\\n`;
  report += `Date : ${date}\\n\\n`;

  SECTIONS.forEach(s => {
    report += `${s.title} : ${state[s.id].score}/20\\n`;
    if (state[s.id].note.trim()) report += `  Notes : ${state[s.id].note.trim()}\\n`;
  });

  report += `\\nSCORE TOTAL : ${total}/100\\n`;
  report += `RECOMMANDATION : ${reco}\\n`;
  return report;
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const report = buildReport();
  try {
    await navigator.clipboard.writeText(report);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = report;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const msg = document.getElementById('copyMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('resetBtn').addEventListener('click', () => {
  SECTIONS.forEach(s => {
    state[s.id] = { score: 10, note: "" };
    document.getElementById(`slider-${s.id}`).value = 10;
    document.getElementById(`val-${s.id}`).textContent = '10 / 20';
    document.getElementById(`badge-${s.id}`).textContent = '10';
    document.getElementById(`note-${s.id}`).value = '';
  });
  document.getElementById('candName').value = '';
  document.getElementById('evalName').value = '';
  document.getElementById('evalDate').valueAsDate = new Date();
  updateVerdict();
});
</script>
</body>
</html>
